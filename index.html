<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Minesweeper Variants</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body><div id="app">
<section id="setup">
 <h1>Minesweeper <span>Plus</span></h1>
 <p class="sub">ノーゲス盤面 × ランダム縛り</p>
 <div class="card"><h3>モード</h3><div class="seg"><button id="mf" class="on">フリープレイ</button><button id="mc">チャレンジ</button></div></div>
 <div class="card"><h3>盤面</h3><div class="row">
  <label class="fld">縦<input id="R" type="number" value="7" min="3" max="24"></label>
  <label class="fld">横<input id="C" type="number" value="7" min="3" max="24"></label>
  <label class="fld">爆弾数<input id="M" type="number" value="8" min="1"></label></div></div>
 <div class="card"><h3>縛り</h3><button id="pk" style="width:100%">🧩 縛りを選ぶ</button><p class="mut" id="sel"></p><p class="mut" id="rcap"></p></div>
 <div class="card" id="chs" hidden><h3>チャレンジ設定</h3><div class="row">
  <label class="fld">目標連続クリア<input id="X" type="number" value="3" min="1"></label>
  <label class="fld">ミス許容<input id="L" type="number" value="1" min="1"></label>
  <label class="fld">ヒント回数<input id="H" type="number" value="3" min="0"></label>
  <label class="fld">縛り数<input id="K" type="number" value="1" min="0" max="6"></label></div>
  <div class="col">
   <label class="tg"><input type="checkbox" id="prog">少しずつ難化(盤面・爆弾率・縛り数)</label>
   <label class="tg"><input type="checkbox" id="rs">盤面サイズをランダム</label>
   <label class="tg"><input type="checkbox" id="rm">爆弾率をランダム</label>
   <label class="tg"><input type="checkbox" id="rk">縛り数をランダム</label></div></div>
 <p class="warn" id="mw"></p>
 <button class="pri big" id="go">スタート</button>
 <p class="mut" id="sm"></p>
 <details class="card" style="margin-top:14px"><summary>検査レポート(AIに渡す用)</summary>
  <p class="mut">ルールを足した/直したら「ルール検査を実行」→ 結果をAIに渡すと、併用の矛盾を直してもらえます。</p>
  <div class="row" style="margin-top:8px"><button id="ct">ルール検査を実行</button><button id="cg">コピー</button><button id="cd">DL</button></div>
  <textarea id="ctx" readonly></textarea></details>
</section>
<section id="game" hidden>
 <div class="row top"><button id="bk">← 設定に戻る</button><button id="rv">🧩 縛り</button></div>
 <div class="chips" id="st"></div>
 <div id="ld" class="card" hidden style="text-align:center"><div id="ldt"></div><button id="lc" style="margin-top:8px">キャンセルして設定に戻る</button></div>
 <div id="msg"></div>
 <div id="g"></div>
 <div class="seg" style="margin-bottom:10px"><button id="fo" class="on">⛏ 開ける</button><button id="ff">🚩 旗</button><button id="fk"><span class="mk">🚩</span> マーク</button></div>
 <div class="row"><button id="hb" class="grow">💡 ヒント</button><button id="nx" class="pri grow" hidden>次の盤面</button></div>
</section></div>
<div id="md" hidden><div id="mb">
 <div class="row"><b id="mt"></b><button id="mx">閉じる</button></div>
 <div class="mut" id="mh">縛りを長押しすると、例の盤面が表示されます</div>
 <input type="search" id="mq" placeholder="縛りを検索(名前・説明)">
 <div id="ml"></div>
 <div class="row" id="mfoot"><button id="ma">表示中を全選択</button><button id="mn">表示中を解除</button><button class="pri" id="mok">決定</button></div>
</div></div>
<div id="ex" hidden><div id="eb"><div class="row"><b id="et"></b><button id="ex2">閉じる</button></div><div id="el"></div></div></div>

<!-- 読み込み順 = 依存順。<script src> はこのファイルが唯一の一覧(build.py もこれを読む) -->
<!-- CORE: 推論・生成。DOM非依存 -->
<script src="js/core/util.js"></script>
<script src="js/core/registry.js"></script>
<script src="js/core/prep.js"></script>
<script src="js/core/solver.js"></script>
<script src="js/core/gen.js"></script>
<script src="js/core/selftest.js"></script>
<!-- RULES: 1ルール=1ファイル(build.py が rules/*.js から自動同期する。_始まりは無視) -->
<!-- RULES:BEGIN -->
 <script src="rules/allConnected.js"></script>
 <script src="rules/noIsolate.js"></script>
 <script src="rules/rect.js"></script>
 <script src="rules/colorDouble.js"></script>
<script src="rules/cross.js"></script>
<script src="rules/groupBomb.js"></script>
<script src="rules/knight.js"></script>
<script src="rules/liar.js"></script>
<script src="rules/lines.js"></script>
<script src="rules/noTouch.js"></script>
<!-- RULES:END -->
<!-- GAME: 設定→盤面設定、盤面の進行 -->
<script src="js/game/state.js"></script>
<script src="js/game/config.js"></script>
<script src="js/game/play.js"></script>
<!-- UI: 描画・モーダル・イベント配線 -->
<script src="js/ui/board.js"></script>
<script src="js/ui/modal.js"></script>
<script src="js/ui/main.js"></script>
</body></html>
