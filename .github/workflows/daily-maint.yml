name: daily-maint
# デイリーを「更新中」にして止める / 解除する。管理者(このリポジトリを操作できる人)だけが GitHub の Actions → daily-maint → Run workflow で使う。
#   予約する: day の 0:00(日本時間)〜次の 0:00 まで、デイリーは新しく始められない(「更新中のため遊べません」)。前日までに予約しておける。
#   止まっている間と、解除されるまでは、新しい盤面は作られず、サイトも受け付けない(daily-board の自動実行も作らない)。
#   解除する: その場で止めるのをやめる(予約の取り消しも同じ)。そのあと盤面が要るなら daily-board を手で実行する(自動の作り直しはしない)。
#   止まるのは「デイリーを新しく始めること」と「新しい盤面の登録」だけ。ランキング・盤面入手・フリープレイ・チャレンジは普通に使える。
on:
  workflow_dispatch:
    inputs:
      action:
        description: '操作(状態を見る=何も変えない)'
        type: choice
        options: ['状態を見る', '予約する', '解除する']
        default: '状態を見る'
      day:
        description: '【予約する】止め始める日 YYYY-MM-DD(空欄=明日。今日の日付=今すぐ止める)'
        required: false
jobs:
  maint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 実行
        env:
          TOKEN: ${{ secrets.DAILY_TOKEN }}
          SITE: ${{ vars.DAILY_SITE }}
          ACT: ${{ github.event.inputs.action }}
          DAY_IN: ${{ github.event.inputs.day }}
        run: |
          [ -n "$SITE" ] || { echo "::error::DAILY_SITE が空です(Settings → Secrets and variables → Actions の「Variables」タブ)"; exit 1; }
          [ -n "$TOKEN" ] || { echo "::error::DAILY_TOKEN が空です(「Secrets」タブ)"; exit 1; }
          case "$SITE" in https://*) ;; *) echo "::error::DAILY_SITE は https:// から始めてください"; exit 1;; esac
          SITE="${SITE%/}"
          URL="$SITE/api/admin/maint"
          show() {
            python3 - <<'PY'
          import json
          try: j=json.load(open('resp.txt'))
          except Exception: j={}
          ph=j.get('phase'); d=j.get('day')
          m={'none':'メンテナンスの予約はありません(通常どおり)',
             'reserved':'予約中: %s の 0:00(日本時間)から止まります。それまでは通常どおり' % d,
             'active':'更新中: 今日(%s)は遊べません。解除するまで、新しい盤面は作られず・受け付けません' % d,
             'overdue':'⚠ %s の更新日は過ぎましたが、まだ解除されていません。デイリーは遊べますが、解除するまで新しい盤面は作られません(解除してください)' % d}
          t=m.get(ph,'状態を読み取れませんでした')
          print('■ '+t)
          open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8').write('### daily-maint\n'+t+'\n')
          PY
          }
          fail() { echo "::error::$1"; exit 1; }
          explain() { # $1=HTTP コード
            case "$1" in
              401) fail "HTTP 401: GitHub の Secrets の DAILY_TOKEN と Cloudflare の DAILY_TOKEN が違います" ;;
              404) fail "HTTP 404: サイトに管理用の機能(functions/api/admin/maint.js)がありません。最新を Cloudflare に反映してください" ;;
              400) fail "HTTP 400: 日付が今日〜30日先の外、または形が違います(YYYY-MM-DD)" ;;
              409) fail "HTTP 409: すでに更新中(または解除忘れ)です。先に「解除する」を実行してください" ;;
              *)   fail "HTTP $1: うまくいきませんでした" ;;
            esac
          }
          case "$ACT" in
            "状態を見る")
              CODE=$(curl -sS -m 30 -o resp.txt -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL"); echo "HTTP $CODE"
              [ "$CODE" = "200" ] || explain "$CODE"
              show ;;
            "予約する")
              DAY="$DAY_IN"; [ -n "$DAY" ] || DAY=$(TZ=Asia/Tokyo date -d '+1 day' +%F)
              echo "$DAY" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || fail "day は YYYY-MM-DD の形で入れてください(空欄なら明日)"
              CODE=$(curl -sS -m 30 -o resp.txt -w '%{http_code}' -X PUT -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data "{\"day\":\"$DAY\"}" "$URL"); echo "HTTP $CODE"
              [ "$CODE" = "200" ] || explain "$CODE"
              show ;;
            "解除する")
              CODE=$(curl -sS -m 30 -o resp.txt -w '%{http_code}' -X DELETE -H "Authorization: Bearer $TOKEN" "$URL"); echo "HTTP $CODE"
              [ "$CODE" = "200" ] || explain "$CODE"
              grep -q '"lifted":true' resp.txt && echo "■ 解除しました。デイリーは遊べる状態に戻り、盤面も受け付けます。盤面が要るときは daily-board を手で実行してください" || echo "■ 解除するものはありませんでした"
              show ;;
            *) fail "操作が分かりません: $ACT" ;;
          esac
