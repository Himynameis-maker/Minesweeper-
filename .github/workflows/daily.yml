name: daily-board
# 毎日 18:00 JST(=09:00 UTC)に翌日分を作る。GitHub の cron は混むと遅れる/落ちることがあるので、22:05 JST(=13:05 UTC)にも走らせ、
# 「その日の盤面がまだ無いときだけ」作る安全網にする。対象の日付は「今から12時間後の JST の日付」(18:00台→翌日 / 22:05台→翌日)。
on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '5 13 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: '対象日 YYYY-MM-DD(空なら自動)'
        required: false
      force:
        description: '盤面がすでにあっても作り直す(ルールセット番号を上げた日に使う)'
        type: boolean
        default: false
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 対象の日付
        id: d
        env:
          DAY_IN: ${{ github.event.inputs.day }}
        run: |
          DAY="$DAY_IN"
          [ -n "$DAY" ] || DAY=$(TZ=Asia/Tokyo date -d '+12 hours' +%F)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
      - name: サイトの設定を確かめる
        env:
          TOKEN: ${{ secrets.DAILY_TOKEN }}
          SITE: ${{ vars.DAILY_SITE }}
        run: |
          [ -n "$SITE" ] || { echo "::error::DAILY_SITE が空です。Settings → Secrets and variables → Actions の「Variables」タブに入れてください(Secrets ではありません)"; exit 1; }
          [ -n "$TOKEN" ] || { echo "::error::DAILY_TOKEN が空です。「Secrets」タブに入れてください"; exit 1; }
          case "$SITE" in https://*) ;; *) echo "::error::DAILY_SITE は https:// から始めてください"; exit 1;; esac
          SITE="${SITE%/}"   # 末尾の / があると //api/... になり、サーバー機能に届かない
          R=$(curl -sS -m 20 "$SITE/ping" || true)
          echo "ping: $R" | head -c 300; echo
          echo "$R" | grep -q '"ok":true' || { echo "::error::$SITE/ping が JSON を返しません。Cloudflare Pages の functions/ が公開されていません(functions/ping.js が無い / ファイル名がおかしい / 別のURL)"; exit 1; }
          echo "$R" | grep -q '"binding":true' || { echo "::error::D1 の Binding(変数名 DB)が Pages に設定されていません"; exit 1; }
          echo "$R" | grep -q '"tables":true' || { echo "::error::D1 に schema.sql が実行されていません(boards テーブルが無い)"; exit 1; }
          echo "$R" | grep -q '"token":true' || { echo "::error::Pages 側の環境変数 DAILY_TOKEN が設定されていません"; exit 1; }
      - name: すでに盤面があるか
        id: ex
        if: ${{ github.event.inputs.force != 'true' }}
        env:
          TOKEN: ${{ secrets.DAILY_TOKEN }}
          SITE: ${{ vars.DAILY_SITE }}
          DAY: ${{ steps.d.outputs.day }}
        run: |
          SITE="${SITE%/}"
          # 「"exists":true」という返事が来たときだけ「ある」。404 の代わりに index.html が 200 で返ってきても「ある」と誤判定しない
          if curl -s -m 20 -H "Authorization: Bearer $TOKEN" "$SITE/api/admin/board?day=$DAY" | grep -q '"exists":true'; then C=200; else C=0; fi
          echo "code=$C" >> "$GITHUB_OUTPUT"
      - name: 盤面を作る
        if: ${{ steps.ex.outputs.code != '200' }}
        env:
          DAY: ${{ steps.d.outputs.day }}
        run: node tools/daily-gen.js payload.json "$DAY"
      - name: サイトへ送る
        if: ${{ steps.ex.outputs.code != '200' }}
        env:
          TOKEN: ${{ secrets.DAILY_TOKEN }}
          SITE: ${{ vars.DAILY_SITE }}
        run: |
          SITE="${SITE%/}"
          CODE=$(curl -sS -m 30 -o resp.txt -w '%{http_code}' -X PUT -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data @payload.json "$SITE/api/admin/board")
          echo "HTTP $CODE"; head -c 300 resp.txt; echo
          [ "$CODE" = "200" ] || { echo "::error::盤面を登録できませんでした(HTTP $CODE)。401=トークン不一致 / 400 range=日付が今日の前後2日の外 / 404=サーバー機能が無い"; exit 1; }
