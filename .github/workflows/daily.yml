name: daily-board
# 毎日 13:52〜18:52 JST(=04:52〜09:52 UTC)の毎時(計6回)に、翌日分の盤面を作る。GitHub の cron は混むと遅れる/落ちることがあり、1回だけだと取りこぼすため、何度も試す。
# 盤面がすでにあれば何もしない(「すでに盤面があるか」)ので、何度走っても害はない。
# 対象の日付は「今から12時間後の JST の日付」: 12:00〜23:59 に走った回は翌日分。この時間帯だけなので、作るのは常に「明日」の盤面。
on:
  schedule:
    - cron: '52 4-9 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: '対象日 YYYY-MM-DD(空なら自動)'
        required: false
      force:
        description: '盤面がすでにあっても作り直す(ルールセット番号を上げた日に使う)'
        type: boolean
        default: false
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 対象の日付
        id: d
        env:
          DAY_IN: ${{ github.event.inputs.day }}
        run: |
          DAY="$DAY_IN"
          [ -n "$DAY" ] || DAY=$(TZ=Asia/Tokyo date -d '+12 hours' +%F)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
      - name: サイトの設定を確かめる
        env:
          TOKEN: ${{ secrets.DAILY_TOKEN }}
          SITE: ${{ vars.DAILY_SITE }}
        run: |
          [ -n "$SITE" ] || { echo "::error::DAILY_SITE が空です。Settings → Secrets and variables → Actions の「Variables」タブに入れてください(Secrets ではありません)"; exit 1; }
          [ -n "$TOKEN" ] || { echo "::error::DAILY_TOKEN が空です。「Secrets」タブに入れてください"; exit 1; }
          case "$SITE" in https://*) ;; *) echo "::error::DAILY_SITE は https:// から始めてください"; exit 1;; esac
          SITE="${SITE%/}"   # 末尾の / があると //api/... になり、サーバー機能に届かない
          R=$(curl -sS -m 20 "$SITE/ping" || true)
          echo "ping: $R" | head -c 300; echo
          echo "$R" | grep -q '"ok":true' || { echo "::error::$SITE/ping が JSON を返しません。Cloudflare Pages の functions/ が公開されていません(functions/ping.js が無い / ファイル名がおかしい / 別のURL)"; exit 1; }
          echo "$R" | grep -q '"binding":true' || { echo "::error::D1 の Binding(変数名 DB)が Pages に設定されていません"; exit 1; }
          echo "$R" | grep -q '"tables":true' || { echo "::error::D1 に schema.sql が実行されていません(boards テーブルが無い)"; exit 1; }
          echo "$R" | grep -q '"token":true' || { echo "::error::Pages 側の環境変数 DAILY_TOKEN が設定されていません"; exit 1; }
      - name: メンテナンス中ではないか
        id: mt
        env:
          TOKEN: ${{ secrets.DAILY_TOKEN }}
          SITE: ${{ vars.DAILY_SITE }}
          EVENT: ${{ github.event_name }}
        run: |
          # デイリーが「更新中」の間と、解除されるまでは、盤面を作らない・送らない(古いバージョンの盤面が入るのを防ぐ。保険の自動実行 22:05 も同じ)。
          # 解除は daily-maint で。そのあとの盤面作りは、この daily-board を手で実行する。サイト側も同じ理由で登録を断る(423)。
          SITE="${SITE%/}"
          R=$(curl -sS -m 20 -H "Authorization: Bearer $TOKEN" "$SITE/api/admin/maint" || true)
          echo "maint: $R" | head -c 300; echo
          if echo "$R" | grep -q '"boardLocked":true'; then
            if echo "$R" | grep -q '"phase":"overdue"'; then
              echo "::error::メンテナンスが解除されていません(更新日は過ぎています)。daily-maint で「解除する」を実行してから、この daily-board を手で実行してください"; exit 1
            fi
            if [ "$EVENT" = "schedule" ]; then
              echo "::notice::更新中(メンテナンス)なので、盤面は作りません。解除は daily-maint で"; echo "locked=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::更新中(メンテナンス)なので、盤面は作れません。先に daily-maint で「解除する」を実行してください"; exit 1
          fi
          echo "locked=false" >> "$GITHUB_OUTPUT"
      - name: すでに盤面があるか
        id: ex
        if: ${{ steps.mt.outputs.locked != 'true' && github.event.inputs.force != 'true' }}
        env:
          TOKEN: ${{ secrets.DAILY_TOKEN }}
          SITE: ${{ vars.DAILY_SITE }}
          DAY: ${{ steps.d.outputs.day }}
        run: |
          SITE="${SITE%/}"
          # 「"exists":true」という返事が来たときだけ「ある」。404 の代わりに index.html が 200 で返ってきても「ある」と誤判定しない
          if curl -s -m 20 -H "Authorization: Bearer $TOKEN" "$SITE/api/admin/board?day=$DAY" | grep -q '"exists":true'; then C=200; else C=0; fi
          echo "code=$C" >> "$GITHUB_OUTPUT"
      - name: 盤面を作る
        if: ${{ steps.mt.outputs.locked != 'true' && steps.ex.outputs.code != '200' }}
        env:
          DAY: ${{ steps.d.outputs.day }}
        run: node tools/daily-gen.js payload.json "$DAY"
      - name: サイトへ送る
        if: ${{ steps.mt.outputs.locked != 'true' && steps.ex.outputs.code != '200' }}
        env:
          TOKEN: ${{ secrets.DAILY_TOKEN }}
          SITE: ${{ vars.DAILY_SITE }}
        run: |
          SITE="${SITE%/}"
          CODE=$(curl -sS -m 30 -o resp.txt -w '%{http_code}' -X PUT -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data @payload.json "$SITE/api/admin/board")
          echo "HTTP $CODE"; head -c 300 resp.txt; echo
          [ "$CODE" = "200" ] || { echo "::error::盤面を登録できませんでした(HTTP $CODE)。401=トークン不一致 / 400 range=日付が今日の前後2日の外 / 404=サーバー機能が無い / 423=更新中(メンテナンス)で受け付けない"; exit 1; }
